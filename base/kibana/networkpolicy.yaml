apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kibana
  namespace: logging
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: efk
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kibana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Omitting `from` allows ingress from all sources (any pod, any namespace,
    # plus the host node — needed for NodePort + kubectl port-forward access).
    # To restrict to an ingress controller, replace this rule with a `from:`
    # block referencing the controller's namespaceSelector.
    - ports:
        - protocol: TCP
          port: 5601
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: elasticsearch
      ports:
        - protocol: TCP
          port: 9200
