apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: logging
  labels:
    app: kibana
    app.kubernetes.io/name: kibana
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: efk
    app.kubernetes.io/version: 7.14.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
        app.kubernetes.io/name: kibana
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: efk
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:7.14.0
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        env:
          - name: ELASTICSEARCH_HOSTS
            value: https://elasticsearch-client.logging.svc.cluster.local:9200
          - name: ELASTICSEARCH_USERNAME
            value: elastic
          - name: ELASTICSEARCH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: elastic-credentials
                key: password
          - name: ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES
            value: /usr/share/kibana/config/certs/ca.crt
          - name: ELASTICSEARCH_SSL_VERIFICATIONMODE
            value: certificate
          - name: XPACK_SECURITY_ENCRYPTIONKEY
            valueFrom:
              secretKeyRef:
                name: elastic-credentials
                key: xpack_encryptionkey
        ports:
        - containerPort: 5601
          name: http
        volumeMounts:
          - name: es-ca
            mountPath: /usr/share/kibana/config/certs
            readOnly: true
        # /api/status requires basic auth when xpack.security is on, so
        # httpGet can't probe it directly. Use exec with curl + creds.
        # Liveness uses a plain TCP check so it doesn't depend on ES
        # being reachable — if Kibana itself is wedged we want a restart,
        # but if ES is temporarily down we don't.
        startupProbe:
          exec:
            command:
              - bash
              - -c
              - >
                curl -fsS -u "elastic:${ELASTICSEARCH_PASSWORD}"
                http://localhost:5601/api/status
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
              - bash
              - -c
              - >
                curl -fsS -u "elastic:${ELASTICSEARCH_PASSWORD}"
                http://localhost:5601/api/status
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 5601
          initialDelaySeconds: 90
          periodSeconds: 30
      volumes:
        - name: es-ca
          secret:
            secretName: es-ca
            defaultMode: 0440
