# Template — do not apply directly. The real Secret is materialized by
# `make secrets`. CA-only Secret mounted into Kibana + Fluentd so they can
# verify the ES server certificate. ES gets the full p12 via `es-tls`;
# this split follows least privilege.
apiVersion: v1
kind: Secret
metadata:
  name: es-ca
  namespace: logging
  labels:
    app.kubernetes.io/part-of: efk
type: Opaque
# data:
#   ca.crt: <base64 of certs/ca.crt>
